<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mezat Oyunu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="İki kişilik kategori açık artırma oyunu: 20 bütçeyle 5 kartlık takımını kur, hakem kazananı seçsin.">
<meta name="theme-color" content="#EEF0E8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="app" id="app" aria-live="polite"><noscript>Bu oyun için JavaScript açık olmalı.</noscript></main>
<script>
// Bir dosya eksik ya da hatalıysa ekran beyaz kalmasın: sebebi yazsın.
(function () {
  function goster(msg) {
    var el = document.getElementById("app");
    if (!el) return;
    el.innerHTML = '<section style="font:15px/1.5 system-ui,sans-serif;padding:16px;border:2px solid #C62828;border-radius:14px;background:#fff;color:#1c1a16">' +
      '<b>Oyun açılamadı.</b><br>' + msg + '<br><br>Çözüm: GitHub\'da <b>Code</b> sekmesinde <code>index.html</code>, <code>css</code>, <code>js</code> ve <code>data</code> klasörlerinin en üst seviyede olduğundan emin ol, sonra sayfayı yenile.</section>';
  }
  window.addEventListener("error", function (e) {
    if (e.target && (e.target.src || e.target.href)) goster("Yüklenemeyen dosya: <code>" + (e.target.src || e.target.href).split("/").slice(-2).join("/") + "</code>");
    else if (e.message) goster("Hata: " + e.message);
  }, true);
  window.addEventListener("load", function () {
    var eksik = [];
    if (!window.MezatEngine) eksik.push("js/engine.js");
    if (!window.MezatTema) eksik.push("js/temalar.js");
    if (eksik.length) goster("Eksik dosya: <code>" + eksik.join("</code>, <code>") + "</code>");
  });
})();
</script>
<script src="js/engine.js"></script>
<script src="js/temalar.js"></script>
<script src="js/app.js"></script>
</body>
</html>
